<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOIR Support</title>
  <meta name="description" content="Installation, service, email and phone support for VOIR." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"></div>
    <span class="cursor__label"></span>
  </div>
  <div id="site-nav"></div>
  <main id="main">

    <section class="hero page-hero" id="hero">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__bg-image"></div>
        <div class="hero__bg-overlay"></div>
      </div>
      <div class="hero__content">
        <p class="hero__eyebrow">Support</p>
        <h1 class="hero__title" data-split="words">How can we help?</h1>
      </div>
    </section>
    <section class="section" id="supportCards">
      <div class="container">
        <div class="support-grid">
          <a class="support-card" href="https://docs.google.com/forms/d/1-rl8pdd3Cd1hJffZR9XPvn1MzcyXANATENd_99oelKY/viewform" target="_blank" rel="noopener">
            <h3>Raise an Installation / Service Request</h3>
            <p>Opens the VOIR installation and service Google Form.</p>
          </a>
          <a class="support-card" href="mailto:support@voir.co.in">
            <h3>Email Address</h3>
            <p>support@voir.co.in</p>
          </a>
          <a class="support-card" href="tel:+918740816000">
            <h3>Call Us</h3>
            <p>+91 87408 16000</p>
          </a>
          <div class="support-card is-disabled">
            <h3>Business Enquiry</h3>
            <p>Business enquiry email — Details to be shared.</p>
          </div>
        </div>
        <div class="section__header" style="margin-top:64px;margin-bottom:24px">
          <h2 class="section__title">Follow us</h2>
        </div>
        <div class="footer__social">
          <a href="https://www.instagram.com/voir.global/" class="footer__social-link" target="_blank" rel="noopener" aria-label="Instagram">IG</a>
          <a href="https://www.facebook.com/search/top?q=voirglobal" class="footer__social-link" target="_blank" rel="noopener" aria-label="Facebook">FB</a>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
