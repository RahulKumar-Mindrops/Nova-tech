<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VOIR TVs — Zenith and Core</title>
  <meta name="description" content="VOIR Zenith Series and Core Series. Google TV · Cloud TV." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="cursor" id="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"></div>
    <span class="cursor__label"></span>
  </div>
  <div id="site-nav"></div>
  <main id="main">

    <section class="hero page-hero" id="hero">
      <div class="hero__bg" aria-hidden="true">
        <div class="hero__bg-image"></div>
        <div class="hero__bg-overlay"></div>
      </div>
      <div class="hero__content">
        <p class="hero__eyebrow">TVs</p>
        <h1 class="hero__title" data-split="words">Zenith Series and Core Series</h1>
        <p class="hero__desc">32" · 40" · 43" · 55" | Google TV · Cloud TV</p>
      </div>
    </section>
    <section class="section" id="products">
      <div class="container">
        <div class="series-tabs" id="seriesTabs" role="tablist">
          <button type="button" class="series-tab is-active" data-series="zenith">Zenith Series</button>
          <button type="button" class="series-tab" data-series="core">Core Series</button>
        </div>
        <div class="model-grid" id="modelGrid"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/chrome.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
